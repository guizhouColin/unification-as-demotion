    <h1>统一即降级 (Unification-as-demotion)</h1>
    <p>这是一个思想试验笔记本。记录从 $E=mc^2$ 到万物理论的推演。</p>
    
    <h2>「降级」的准确定义</h2>
    <p>在这里，“降级”不是倒退，而是有效场论视角下的必然：</p>
    <ul>
        <li>狭义相对论 $\rightarrow$ 广义相对论在局部惯性系下的近似</li>
        <li>量子电动力学 $\rightarrow$ 标准模型的低能版本</li>
        <li>广义相对论/量子场论 $\rightarrow$ 某个更底层结构的有效理论</li>
    </ul>
    <p>统一理论，就是把旧理论“降级”为特例。</p>
